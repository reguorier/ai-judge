<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Judge public audit flow</title>
  <desc id="desc">A source-isolated audit flow from model answer to evidence isolation, claim-support audit, dissent, and human-final report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f4"/>
      <stop offset="1" stop-color="#e7ece8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a66c2"/>
      <stop offset="1" stop-color="#087a68"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#17202a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#71808b"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="80" y="70" width="1440" height="760" rx="28" fill="#ffffff" stroke="#cfd8d3"/>
  <text x="130" y="145" fill="#17202a" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="760">AI Judge: source-isolated claim-support audit</text>
  <text x="132" y="190" fill="#5c6670" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">A real citation can still fail to prove the exact claim. AI Judge makes that gap visible before reuse.</text>

  <g filter="url(#shadow)">
    <rect x="130" y="275" width="245" height="185" rx="18" fill="#f8faf8" stroke="#ccd5d1"/>
    <text x="160" y="325" fill="#0a66c2" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="760">1. Model answer</text>
    <text x="160" y="365" fill="#17202a" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="760">Keep raw text</text>
    <text x="160" y="402" fill="#5c6670" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">No silent rewrite.</text>
    <text x="160" y="430" fill="#5c6670" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">No self-verifying sources.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="275" width="245" height="185" rx="18" fill="#f8faf8" stroke="#ccd5d1"/>
    <text x="475" y="325" fill="#087a68" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="760">2. Isolate evidence</text>
    <text x="475" y="365" fill="#17202a" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="760">Separate sources</text>
    <text x="475" y="402" fill="#5c6670" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Model-mentioned.</text>
    <text x="475" y="430" fill="#5c6670" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Supplied. Fetched.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="275" width="245" height="185" rx="18" fill="#f8faf8" stroke="#ccd5d1"/>
    <text x="790" y="325" fill="#9a6500" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="760">3. Audit claim span</text>
    <text x="790" y="365" fill="#17202a" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="760">Support or gap?</text>
    <text x="790" y="402" fill="#5c6670" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Verified. Weak.</text>
    <text x="790" y="430" fill="#5c6670" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Contradicted. Overclaimed.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1075" y="275" width="245" height="185" rx="18" fill="#f8faf8" stroke="#ccd5d1"/>
    <text x="1105" y="325" fill="#a43c38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="760">4. Preserve dissent</text>
    <text x="1105" y="365" fill="#17202a" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="760">Show blockers</text>
    <text x="1105" y="402" fill="#5c6670" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Confidence comes after</text>
    <text x="1105" y="430" fill="#5c6670" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">evidence and challenge.</text>
  </g>

  <line x1="385" y1="367" x2="428" y2="367" stroke="#71808b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="700" y1="367" x2="743" y2="367" stroke="#71808b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1015" y1="367" x2="1058" y2="367" stroke="#71808b" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="235" y="570" width="480" height="145" rx="20" fill="#17202a"/>
    <text x="275" y="625" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="760">Human-final report</text>
    <text x="275" y="665" fill="#d9e8e4" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">HTML, JSON, Markdown, certification handle, failure reasons.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="805" y="570" width="480" height="145" rx="20" fill="url(#blue)"/>
    <text x="845" y="625" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="760">Live public demo</text>
    <text x="845" y="665" fill="#e8fbf7" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">huggingface.co/spaces/reguorier/ai-judge-citation-audit</text>
  </g>

  <line x1="1198" y1="465" x2="1048" y2="548" stroke="#71808b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="882" y1="465" x2="502" y2="548" stroke="#71808b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="130" y="760" width="1340" height="44" rx="22" fill="#eef2ef" stroke="#cfd8d3"/>
  <text x="160" y="790" fill="#5c6670" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Public repo: product explanation, sanitized examples, benchmark cases, and demo links. Private runtime: browser seats, local orchestration, customer facts, and commercial workflow code.</text>
</svg>
